<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiragana Road Fighter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="ui-overlay">
            <div id="score-board" class="ui-panel">SCORE<br><span id="score">0</span></div>
            <div id="fuel-gauge" class="ui-panel">FUEL<br><progress id="fuel" value="100" max="100"></progress></div>
            <div id="stage-info" class="ui-panel">STAGE<br>1</div>
        </div>
        <div id="instructions">
            <strong>Controls:</strong> &larr; &rarr; to steer | &uarr; to accelerate | &darr; to brake<br>
            Hit the car with the matching Romaji to get GAS!
        </div>
        <div id="game-over" class="hidden">
            <h1 id="game-over-title">GAME OVER</h1>
            <p>Score: <span id="final-score">0</span></p>
            <button id="restart-btn">Restart</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
